<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localisto Webchat</title>
    <style>
        #localisto-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            max-height: 500px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            font-family: Arial, sans-serif;
            z-index: 10000;
        }
        #chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            font-size: 14px;
        }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 80%; }
        .user { background: #e9ecef; align-self: flex-end; margin-left: auto; }
        .bot { background: #007bff; color: white; align-self: flex-start; }
        #chat-input-container { padding: 15px; border-top: 1px solid #ccc; display: flex; }
        #chat-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
        #send-btn { margin-left: 10px; padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #007bff;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10001;
        }
    </style>
</head>
<body>

<div id="chat-toggle">💬</div>

<div id="localisto-chat">
    <div id="chat-header">
        <span>Localisto - Localicer.com</span>
        <span id="close-chat" style="cursor:pointer;">×</span>
    </div>
    <div id="chat-messages" style="display: flex; flex-direction: column;">
        <div class="message bot">¡Hola! Soy Localisto. ¿En qué puedo ayudarte hoy?</div>
    </div>
    <div id="chat-input-container">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje...">
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    const chat = document.getElementById('localisto-chat');
    const toggle = document.getElementById('chat-toggle');
    const close = document.getElementById('close-chat');
    const input = document.getElementById('chat-input');
    const send = document.getElementById('send-btn');
    const messages = document.getElementById('chat-messages');

    let userId = 'web_' + Math.random().toString(36).substr(2, 9);

    toggle.onclick = () => { chat.style.display = 'flex'; toggle.style.display = 'none'; };
    close.onclick = () => { chat.style.display = 'none'; toggle.style.display = 'flex'; };

    const addMessage = (text, role) => {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.innerText = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    };

    const sendMessage = async () => {
        const text = input.value.trim();
        if (!text) return;
        
        input.value = '';
        addMessage(text, 'user');

        try {
            const response = await fetch('/v2/whatsapp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, message: text })
            });
            const data = await response.json();
            addMessage(data.reply, 'bot');
        } catch (e) {
            addMessage('Error de conexión.', 'bot');
        }
    };

    send.onclick = sendMessage;
    input.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>

</body>
</html>
